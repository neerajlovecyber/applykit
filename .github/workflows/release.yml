name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version Bump
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version-check.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check if version in package.json changed
        id: version-check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            OLD_VER=$(git show HEAD~1:package.json | grep '"version"' | head -1 | awk -F '"' '{print $4}' || echo "")
            NEW_VER=$(cat package.json | grep '"version"' | head -1 | awk -F '"' '{print $4}')
            if [ -n "$OLD_VER" ] && [ "$OLD_VER" != "$NEW_VER" ]; then
              echo "Version bumped from $OLD_VER to $NEW_VER"
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "Version in package.json ($NEW_VER) was not bumped. Skipping release."
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    name: Build & Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            C:\Users\runneradmin\AppData\Local\electron\Cache
            C:\Users\runneradmin\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: bun install

      - name: Build App Assets
        run: bun run vite:build:app

      - name: Create Git Tag if Missing
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${PACKAGE_VERSION}"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating git tag $TAG_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG_NAME" || true
            git push origin "$TAG_NAME" || true
          fi

      - name: Publish Release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
